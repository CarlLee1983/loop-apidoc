<svg width="1120" height="660" viewBox="0 0 1120 660" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">一次完整執行的端到端資料流</title>
  <desc id="desc">從可選前處理、manifest、任何 agent 讀取前的來源風險檢查、agent 擷取、plan、preparation、generate、validate，到可選 score 與 diff 的完整資料流。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2c3043" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#15a39a"/>
    </marker>
    <style>
      text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .h{font-size:26px;font-weight:900;fill:#2c3043}
      .p{font-size:16px;fill:#5d6478}
      .stage{font-size:18px;font-weight:850;fill:#2c3043}
      .out{font-size:13px;font-weight:750}
      .lane{font-size:14px;font-weight:900;letter-spacing:.12em}
    </style>
  </defs>
  <rect width="1120" height="660" rx="28" fill="#fff"/>
  <rect x="24" y="24" width="1072" height="612" rx="24" fill="#faf7ef" stroke="#ece5d8" stroke-width="2"/>
  <text x="62" y="78" class="h">端到端資料流：從來源到可審查 run-dir</text>
  <text x="62" y="111" class="p">灰色是可選階段；來源風險檢查在任何 agent 讀取前執行。</text>

  <rect x="62" y="156" width="996" height="102" rx="16" fill="#fff" stroke="#ece5d8"/>
  <rect x="62" y="290" width="996" height="102" rx="16" fill="#fff" stroke="#ece5d8"/>
  <rect x="62" y="424" width="996" height="102" rx="16" fill="#fff" stroke="#ece5d8"/>
  <text x="88" y="186" class="lane" fill="#7c6df2">來源準備 / AGENT-NATIVE 擷取層</text>
  <text x="88" y="320" class="lane" fill="#15a39a">確定性組裝 / 驗證層</text>
  <text x="88" y="454" class="lane" fill="#7c6df2">後段判讀 / 版本層</text>

  <g filter="url(#shadow)">
    <rect x="82" y="198" width="180" height="74" rx="12" fill="#e7e3fd" stroke="#7c6df2"/>
    <text x="172" y="226" text-anchor="middle" class="stage">0 preprocess</text>
    <text x="172" y="250" text-anchor="middle" class="mono out" fill="#5b4cc4">scannable sources</text>
    <rect x="310" y="198" width="180" height="74" rx="12" fill="#d8f3f0" stroke="#15a39a"/>
    <text x="400" y="226" text-anchor="middle" class="stage">1 manifest</text>
    <text x="400" y="250" text-anchor="middle" class="mono out" fill="#0f7a73">source identity</text>
    <rect x="538" y="198" width="180" height="74" rx="12" fill="#ffd9d9" stroke="#d95757"/>
    <text x="628" y="226" text-anchor="middle" class="stage">2 source-risk</text>
    <text x="628" y="250" text-anchor="middle" class="mono out" fill="#9f3030">pre-agent gate</text>
    <rect x="766" y="198" width="180" height="74" rx="12" fill="#fdeccb" stroke="#f5a524"/>
    <text x="856" y="226" text-anchor="middle" class="stage">3 擷取</text>
    <text x="856" y="250" text-anchor="middle" class="mono out" fill="#b5791a">inventory + endpoints</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="122" y="332" width="160" height="74" rx="12" fill="#d8f3f0" stroke="#15a39a"/>
    <text x="202" y="360" text-anchor="middle" class="stage">4 plan</text>
    <text x="202" y="384" text-anchor="middle" class="mono out" fill="#0f7a73">normalization-plan</text>
    <rect x="330" y="332" width="160" height="74" rx="12" fill="#d8f3f0" stroke="#15a39a"/>
    <text x="410" y="360" text-anchor="middle" class="stage">5 preparation</text>
    <text x="410" y="384" text-anchor="middle" class="mono out" fill="#0f7a73">readiness report</text>
    <rect x="538" y="332" width="160" height="74" rx="12" fill="#d8f3f0" stroke="#15a39a"/>
    <text x="618" y="360" text-anchor="middle" class="stage">6 generate</text>
    <text x="618" y="384" text-anchor="middle" class="mono out" fill="#0f7a73">OpenAPI + guide</text>
    <rect x="746" y="332" width="160" height="74" rx="12" fill="#d8f3f0" stroke="#15a39a"/>
    <text x="826" y="360" text-anchor="middle" class="stage">7 validate</text>
    <text x="826" y="384" text-anchor="middle" class="mono out" fill="#0f7a73">report</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="668" y="466" width="132" height="74" rx="12" fill="#e7e3fd" stroke="#7c6df2"/>
    <text x="734" y="494" text-anchor="middle" class="stage">8 score</text>
    <text x="734" y="518" text-anchor="middle" class="mono out" fill="#5b4cc4">quality signal</text>
    <rect x="850" y="466" width="132" height="74" rx="12" fill="#e7e3fd" stroke="#7c6df2"/>
    <text x="916" y="494" text-anchor="middle" class="stage">9 diff</text>
    <text x="916" y="518" text-anchor="middle" class="mono out" fill="#5b4cc4">impact report</text>
  </g>
  <path d="M262 235H310" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M490 235H538" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M718 235H766" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M856 272V300H282V332" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M282 369H330" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M490 369H538" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M698 369H746" stroke="#15a39a" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M826 406C826 438 734 438 734 466" stroke="#7c6df2" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M850 503H800" stroke="#7c6df2" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="392" y="566" width="336" height="42" rx="21" fill="#2c3043"/>
  <text x="560" y="592" text-anchor="middle" class="mono" font-size="15" font-weight="800" fill="#ffd9a8">run-dir = 契約 + 證據 + 品質 + 交接資產</text>
</svg>
