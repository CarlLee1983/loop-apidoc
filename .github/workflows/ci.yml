name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Canonical verification
        # The full suite includes tests/test_benchmarks.py. Benchmark *case* runs
        # SKIP in CI (sources/ are operator-provided and gitignored), but the
        # discovery guard test_benchmark_harness_discovers_cases still runs and
        # FAILS if any required benchmark case is lost — so coverage can't silently
        # go vacuous. See docs/RELEASE_CHECKLIST.md for what needs local sources.
        # The default gate tolerates benchmark skips; only --strict-local fails on skips.
        run: make verify
