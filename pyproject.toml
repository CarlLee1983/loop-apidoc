[project]
name = "loop-apidoc"
version = "0.33.2"
description = "Source-grounded API documentation pipeline for Loop Engineering"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.21",
    "pymupdf>=1.24",
    "pymupdf4llm>=1.27.2.3",
]

[project.scripts]
loop-apidoc = "loop_apidoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loop_apidoc"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
extend-exclude = ["work"]

[tool.coverage.report]
fail_under = 92.5
# The governed-asset publication and fd-resolution paths pick a platform-specific
# syscall (renameatx_np/F_GETPATH on Darwin, renameat2//proc/self/fd on Linux). The
# branch for the other platform can never run on the host doing the measuring, so
# leaving it in makes the same tree score differently on macOS and on Linux CI.
# Exclude both guards so the gate measures one platform-independent denominator.
exclude_also = [
    'if sys\.platform == "darwin":',
    'elif sys\.platform\.startswith\("linux"\):',
]
