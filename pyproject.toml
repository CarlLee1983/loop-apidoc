[project]
name = "loop-apidoc"
version = "0.40.0"
description = "Source-grounded API documentation pipeline for Loop Engineering"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "jsonschema>=4.21",
    "pymupdf>=1.24",
    "pymupdf4llm>=1.27.2.3",
]

[project.scripts]
loop-apidoc = "loop_apidoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loop_apidoc"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "THIRD_PARTY_NOTICES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A test that proves something terminates must fail when it does not. Without a
# timeout the loop this repo guards against (`extraction/field_names.py`'s `seen`
# set) turns its own regression test into a hang: the suite never returns, CI
# dies on the job timeout, and the offending test's name never appears in the
# output. The slowest test in the suite is 7.4s (measured with --durations), so
# 300s only ever fires on a genuine hang, never on a loaded machine (#127).
timeout = 300

[tool.ruff]
extend-exclude = ["work"]

[tool.coverage.report]
fail_under = 92.5
# Both branches of every platform-specific syscall guard are excluded so the gate
# measures one platform-independent denominator. Only such guards belong here; see
# docs/adr/0003-measure-coverage-on-a-platform-independent-denominator.md.
exclude_also = [
    'if sys\.platform == "darwin":',
    'elif sys\.platform\.startswith\("linux"\):',
]
